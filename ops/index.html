<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luma Bistro — Live Operations</title>
<style>
  :root {
    color-scheme: light dark;
    --plane:#f9f9f7; --surface:#fcfcfb;
    --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
    --grid:#e1e0d9; --border:rgba(11,11,11,0.10);
    /* Sequential blue, light->dark: remaining seats is a magnitude. */
    --seq-0:#f0efec; --seq-1:#cde2fb; --seq-2:#9ec5f4; --seq-3:#6da7ec;
    --seq-4:#3987e5; --seq-5:#256abf; --seq-6:#104281;
    /* Status palette — fixed, never themed. Always paired with an icon. */
    --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
    --info:#2a78d6;
  }
  /* Dark values are declared under both scopes: the media query covers the OS
     setting, the data-theme scope covers an explicit ?theme= override, and the
     :not() guard lets a light stamp beat OS-dark. */
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      --plane:#0d0d0d; --surface:#1a1a19;
      --ink:#fff; --ink-2:#c3c2b7; --muted:#898781;
      --grid:#2c2c2a; --border:rgba(255,255,255,0.10);
      --seq-0:#383835; --info:#3987e5;
    }
  }
  :root[data-theme="dark"] {
    --plane:#0d0d0d; --surface:#1a1a19;
    --ink:#fff; --ink-2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --border:rgba(255,255,255,0.10);
    --seq-0:#383835; --info:#3987e5;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; padding:20px; background:var(--plane); color:var(--ink);
    font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  header { display:flex; align-items:center; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
  h1 { font-size:19px; margin:0; font-weight:600; letter-spacing:-0.01em; }
  .meta { color:var(--muted); font-size:12px; }
  .dot { display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:5px; }

  .call {
    font:inherit; font-weight:600; font-size:13px; cursor:pointer;
    padding:7px 16px; border-radius:999px; border:1px solid transparent;
    background:var(--good); color:#fff; transition:background .12s;
  }
  .call:hover { filter:brightness(1.08); }
  .call:disabled { opacity:.55; cursor:default; }
  .call.live { background:var(--critical); }
  /* A calm ring while the caller is being listened to; it pulses only while
     the agent is actually speaking, so the state is visible without sound. */
  .call.speaking { box-shadow:0 0 0 0 rgba(12,163,12,.55); animation:pulse 1.4s infinite; }
  @keyframes pulse {
    70%  { box-shadow:0 0 0 9px rgba(12,163,12,0); }
    100% { box-shadow:0 0 0 0 rgba(12,163,12,0); }
  }

  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin-bottom:16px; }
  .kpi { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:12px 14px; }
  .kpi .v { font-size:26px; font-weight:600; line-height:1.15; letter-spacing:-0.02em; }
  .kpi .l { color:var(--ink-2); font-size:11px; text-transform:uppercase; letter-spacing:0.05em; margin-top:2px; }
  .kpi .s { color:var(--muted); font-size:11px; margin-top:3px; }

  .cols { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.15fr); gap:14px; align-items:start; }
  @media (max-width:900px) { .cols { grid-template-columns:1fr; } }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:14px; }
  .card h2 { font-size:12px; text-transform:uppercase; letter-spacing:0.05em;
             color:var(--ink-2); margin:0 0 10px; font-weight:600; }

  table { border-collapse:separate; border-spacing:2px; width:100%; }
  th { font-size:11px; color:var(--muted); font-weight:500; text-align:center; padding-bottom:2px;
       font-variant-numeric:tabular-nums; }
  td.date { font-size:11px; color:var(--ink-2); text-align:right; padding-right:8px; white-space:nowrap; }
  td.cell { text-align:center; border-radius:4px; padding:9px 0; font-size:13px; font-weight:600;
            font-variant-numeric:tabular-nums; }
  .legend { display:flex; align-items:center; gap:6px; margin-top:10px; font-size:11px;
            color:var(--muted); white-space:nowrap; }
  .legend i { width:17px; height:9px; border-radius:2px; display:inline-block; flex:0 0 auto; }
  .legend .note { margin-left:auto; padding-left:12px; overflow:hidden; text-overflow:ellipsis; }

  .feed { max-height:460px; overflow-y:auto; }
  .ev { display:flex; gap:9px; padding:6px 2px; border-bottom:1px solid var(--grid); align-items:flex-start; }
  .ev:last-child { border-bottom:0; }
  .ev .ic { flex:0 0 15px; text-align:center; font-size:11px; line-height:1.5; }
  .ev .tx { min-width:0; flex:1; }
  .ev .lb { font-weight:500; }
  .ev .dt { color:var(--muted); font-size:12px; word-break:break-word; }
  .ev .tm { color:var(--muted); font-size:11px; font-variant-numeric:tabular-nums; flex:0 0 auto; }
  .ev.caller .lb, .ev.agent .lb { color:var(--ink-2); font-weight:600; }
  .ev.caller .dt, .ev.agent .dt { color:var(--ink); }
  .empty { color:var(--muted); padding:22px 0; text-align:center; }

  .res { border:1px solid var(--border); border-radius:9px; margin-bottom:8px; overflow:hidden; }
  .res:last-child { margin-bottom:0; }
  .res summary {
    cursor:pointer; list-style:none; padding:11px 13px; display:flex;
    align-items:center; gap:11px; flex-wrap:wrap;
  }
  .res summary::-webkit-details-marker { display:none; }
  .res summary:hover { background:color-mix(in srgb, var(--ink) 4%, transparent); }
  .res .code { font-weight:600; font-variant-numeric:tabular-nums; }
  .res .who  { color:var(--ink); }
  .res .when { color:var(--ink-2); }
  .res .chip {
    margin-left:auto; font-size:11px; font-weight:600; padding:2px 9px; border-radius:999px;
    border:1px solid currentColor;
  }
  .res .chip.confirmed { color:var(--good); }
  .res .chip.cancelled { color:var(--critical); }
  .res dl {
    margin:0; padding:0 13px 13px; display:grid; grid-template-columns:auto 1fr;
    gap:5px 14px; font-size:13px; border-top:1px solid var(--grid); padding-top:11px;
  }
  .res dt { color:var(--muted); }
  .res dd { margin:0; word-break:break-word; }
  .res dd.mono { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11.5px; }
</style>
</head>
<body>
<header>
  <h1>Luma Bistro — Live Operations</h1>
  <button id="call" class="call">Start call</button>
  <span class="meta" id="callState"></span>
  <span class="meta" id="status" style="margin-left:auto"></span>
</header>

<div class="kpis" id="kpis"></div>

<div class="cols">
  <div class="card">
    <h2>Remaining seats by slot</h2>
    <div id="grid"></div>
    <div class="legend">
      <span>0</span>
      <i style="background:var(--seq-0)"></i><i style="background:var(--seq-1)"></i>
      <i style="background:var(--seq-2)"></i><i style="background:var(--seq-3)"></i>
      <i style="background:var(--seq-4)"></i><i style="background:var(--seq-5)"></i>
      <i style="background:var(--seq-6)"></i>
      <span>8</span>
      <span class="note">2026-08-16 not polled — its one-shot 503 is reserved for the failure demo</span>
    </div>
  </div>

  <div class="card">
    <h2>Agent event stream</h2>
    <div class="feed" id="feed"></div>
  </div>
</div>

<div class="card" id="resCard" style="margin-top:14px; display:none">
  <h2>Reservations this call</h2>
  <div id="reservations"></div>
</div>

<script src="/vendor/livekit-client.umd.min.js"></script>
<script>
// ?theme=light|dark forces a mode, for screen recording where the OS setting
// isn't what you want on camera. Omit it to follow the OS.
const forced = new URLSearchParams(location.search).get("theme");
if (forced === "light" || forced === "dark") {
  document.documentElement.setAttribute("data-theme", forced);
}

const ICON = { good:"●", warning:"▲", serious:"▲", critical:"■", info:"·",
               caller:"▸", agent:"◂", latency:"◷" };
const COLOR = { good:"var(--good)", warning:"var(--warning)", serious:"var(--serious)",
                critical:"var(--critical)", info:"var(--muted)", caller:"var(--ink-2)",
                agent:"var(--info)", latency:"var(--info)" };

function seqStep(n) {
  // Remaining seats 0..8 -> one blue hue, light to dark.
  // Ink is chosen from the *fill step*, never from the seat count and never
  // from the theme: two cells sharing a fill must share their text colour, and
  // the blue steps are identical in light and dark mode.
  if (n === null || n === undefined) return ["var(--grid)", "var(--muted)"];
  const steps = [0, 1, 1, 2, 3, 3, 4, 5, 6];
  const step = steps[Math.max(0, Math.min(8, n))];
  // Step 0 is the only themed fill (near-white on light, near-black on dark),
  // so it alone follows the theme ink.
  const ink = step === 0 ? "var(--ink)" : (step >= 4 ? "#ffffff" : "#0b0b0b");
  return [`var(--seq-${step})`, ink];
}

function hhmm(ts) {
  if (!ts) return "";
  const d = new Date(ts * 1000);
  return d.toTimeString().slice(0, 8);
}

function kpi(v, label, sub) {
  return `<div class="kpi"><div class="v">${v}</div><div class="l">${label}</div>` +
         (sub ? `<div class="s">${sub}</div>` : "") + `</div>`;
}

// A single dropped poll is not an outage. Keep the last good render and only
// admit a problem after a few consecutive failures, so a momentary blip does
// not flash "unreachable" across a recording.
let misses = 0;

function esc(v) {
  return String(v ?? "—").replace(/[&<>"]/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

// Cards stay collapsed/expanded across the 1 Hz refresh: re-rendering an open
// <details> shut every second would make it impossible to read.
const openCards = new Set();

function renderReservations(list) {
  const card = document.getElementById("resCard");
  card.style.display = list.length ? "" : "none";
  if (!list.length) return;

  document.getElementById("reservations").innerHTML = list.map(r => {
    const id = r.reservation_id;
    const status = (r.status || "confirmed").toLowerCase();
    const when = r.date ? `${r.date} at ${r.time}` : "";
    return `
      <details class="res" data-id="${esc(id)}" ${openCards.has(id) ? "open" : ""}>
        <summary>
          <span class="code">${esc(r.confirmation_code)}</span>
          <span class="who">${esc(r.name)}</span>
          <span class="when">${esc(when)} · party of ${esc(r.party_size)}</span>
          <span class="chip ${status}">${esc(status)}</span>
        </summary>
        <dl>
          <dt>Name</dt><dd>${esc(r.name)}</dd>
          <dt>Phone</dt><dd>${esc(r.phone)}</dd>
          <dt>Date</dt><dd>${esc(r.date)}</dd>
          <dt>Time</dt><dd>${esc(r.time)}</dd>
          <dt>Party</dt><dd>${esc(r.party_size)}</dd>
          <dt>Notes</dt><dd>${esc(r.notes)}</dd>
          <dt>Status</dt><dd>${esc(r.status)}</dd>
          <dt>History</dt><dd>${esc((r.history || []).join(" → "))}</dd>
          <dt>Reservation id</dt><dd class="mono">${esc(id)}</dd>
          <dt>Idempotency key</dt><dd class="mono">${esc(r.idempotency_key)}</dd>
        </dl>
      </details>`;
  }).join("");

  for (const el of document.querySelectorAll(".res")) {
    el.addEventListener("toggle", () => {
      el.open ? openCards.add(el.dataset.id) : openCards.delete(el.dataset.id);
    });
  }
}

async function tick() {
  let d;
  try {
    d = await (await fetch("/api/state")).json();
    misses = 0;
  } catch {
    if (++misses >= 3) {
      document.getElementById("status").textContent = "ops server unreachable";
    }
    return;
  }

  document.getElementById("status").innerHTML =
    `<span class="dot" style="background:${d.api_online ? "var(--good)" : "var(--critical)"}"></span>` +
    `${d.api_online ? "API online" : "API offline"} · ${d.api_url}` +
    (d.session ? ` · session ${d.session}` : " · no call yet");

  const s = d.stats || {};
  document.getElementById("kpis").innerHTML =
      kpi(s.created ?? 0, "Reservations written")
    + kpi(s.duplicates_prevented ?? 0, "Duplicates blocked")
    + kpi(s.retries ?? 0, "Recovered retries")
    + kpi(s.interruptions ?? 0, "Barge-ins")
    + kpi(s.turn_p50 != null ? s.turn_p50 + " ms" : "—", "Turn latency p50",
          s.turn_p50 != null
            ? `eou ${s.eou_p50 ?? "–"} · ttft ${s.ttft_p50 ?? "–"} · ttfb ${s.ttfb_p50 ?? "–"} ms`
            : "awaiting a voice turn")
    + kpi(s.turn_p95 != null ? s.turn_p95 + " ms" : "—", "Turn latency p95",
          s.turns ? `${s.turns} turns measured` : "");

  let html = "<table><tr><th></th>" + d.slots.map(t => `<th>${t}</th>`).join("") + "</tr>";
  for (const date of d.dates) {
    const row = (d.grid || {})[date] || {};
    html += `<tr><td class="date">${date}</td>`;
    for (const slot of d.slots) {
      const n = row[slot];
      const [bg, ink] = seqStep(n);
      html += `<td class="cell" style="background:${bg};color:${ink}">${n ?? "–"}</td>`;
    }
    html += "</tr>";
  }
  document.getElementById("grid").innerHTML = html + "</table>";

  renderReservations(d.reservations || []);

  const feed = document.getElementById("feed");
  const pinned = feed.scrollTop + feed.clientHeight >= feed.scrollHeight - 40;
  const evs = d.events || [];
  feed.innerHTML = evs.length ? evs.slice().reverse().map(e => `
      <div class="ev ${e.level}">
        <span class="ic" style="color:${COLOR[e.level] || "var(--muted)"}">${ICON[e.level] || "·"}</span>
        <span class="tx"><span class="lb">${e.label}</span>
          ${e.detail ? `<div class="dt">${e.detail}</div>` : ""}</span>
        <span class="tm">${hhmm(e.ts)}</span>
      </div>`).join("")
    : `<div class="empty">No activity yet — start a call.</div>`;
  if (pinned) feed.scrollTop = 0;
}

tick();
setInterval(tick, 1000);

/* ---- Call widget -------------------------------------------------------
   Joins a LiveKit room from the browser and publishes the microphone. The
   agent worker is dispatched into the room automatically, so there is nothing
   to wire up between them. The API secret stays on the server; the page only
   ever holds a short-lived JWT scoped to one room.                        */
const LK = window.LivekitClient;
const btn = document.getElementById("call");
const callState = document.getElementById("callState");
let room = null;

/* Ringback. The agent takes a few seconds to be dispatched and join, and dead
   silence in that gap reads as "broken" -- it is what makes a caller say
   "hello? can you hear me?" into a line that is still connecting. A standard
   ringing cadence says "it's working, hold on", exactly like a real phone.
   Synthesised with WebAudio so there is no asset to ship or fail to load.
   UK cadence: two 400+450Hz bursts, then a long pause. */
const Ring = (() => {
  let actx = null, timer = null;

  function burst(at, seconds) {
    const gain = actx.createGain();
    gain.connect(actx.destination);
    // Shaped edges: a raw square-edged tone clicks audibly.
    gain.gain.setValueAtTime(0, at);
    gain.gain.linearRampToValueAtTime(0.12, at + 0.02);
    gain.gain.setValueAtTime(0.12, at + seconds - 0.02);
    gain.gain.linearRampToValueAtTime(0, at + seconds);
    for (const hz of [400, 450]) {
      const osc = actx.createOscillator();
      osc.type = "sine";
      osc.frequency.value = hz;
      osc.connect(gain);
      osc.start(at);
      osc.stop(at + seconds);
    }
  }

  function cycle() {
    const t = actx.currentTime;
    burst(t, 0.4);
    burst(t + 0.6, 0.4);
  }

  return {
    start() {
      // Created inside the click handler, so the browser counts it as a
      // user gesture and autoplay policy allows it.
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === "suspended") actx.resume();
      cycle();
      timer = setInterval(cycle, 3000);
    },
    stop() {
      clearInterval(timer);
      timer = null;
    },
  };
})();

function setCallState(text, cls) {
  callState.textContent = text;
  btn.className = "call" + (cls ? " " + cls : "");
}

async function startCall() {
  btn.disabled = true;
  setCallState("ringing…", "live");
  Ring.start();
  try {
    const cfg = await (await fetch("/api/token", { method: "POST" })).json();
    if (cfg.detail) throw new Error(cfg.detail);

    room = new LK.Room({ adaptiveStream: true, dynacast: true });

    // The agent's voice. `attach()` builds the <audio> element but does not
    // place it: append it to the document or some browsers never start
    // playback, and the call is silent for no visible reason.
    room.on(LK.RoomEvent.TrackSubscribed, (track) => {
      if (track.kind !== LK.Track.Kind.Audio) return;
      const el = track.attach();
      el.autoplay = true;
      el.style.display = "none";
      document.body.appendChild(el);
      el.play?.().catch(() => {});
      // The agent has audio on the line: the call is answered, stop ringing.
      Ring.stop();
      setCallState("connected", "live");
    });
    room.on(LK.RoomEvent.Disconnected, () => endCall(true));
    // Mirrors the agent's own speaking state, so the button shows who has the
    // floor -- the visual counterpart of barge-in.
    room.on(LK.RoomEvent.ActiveSpeakersChanged, (speakers) => {
      const agentTalking = speakers.some((p) => p.identity !== room.localParticipant.identity);
      setCallState(agentTalking ? "Ava is speaking" : "listening…", agentTalking ? "live speaking" : "live");
    });

    await room.connect(cfg.url, cfg.token);
    await room.localParticipant.setMicrophoneEnabled(true);

    btn.textContent = "End call";
    btn.disabled = false;
    // Keep ringing until the agent's audio actually arrives; TrackSubscribed
    // stops it. Connecting the socket is not the same as being answered.
  } catch (e) {
    Ring.stop();
    btn.disabled = false;
    setCallState("failed: " + (e.message || e), "");
    room = null;
  }
}

async function endCall(remote) {
  Ring.stop();
  if (room && !remote) await room.disconnect();
  for (const el of document.querySelectorAll("audio[data-lk-attached], audio")) {
    if (el.srcObject) { el.pause(); el.remove(); }
  }
  room = null;
  btn.textContent = "Start call";
  btn.disabled = false;
  setCallState("", "");
}

btn.addEventListener("click", () => (room ? endCall(false) : startCall()));
if (!LK) {
  btn.disabled = true;
  setCallState("livekit-client not loaded — run scripts/fetch_vendor.sh", "");
}
</script>
</body>
</html>
