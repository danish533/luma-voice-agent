# Alembic configuration.
#
# The database URL is deliberately absent here: it lives in DATABASE_URL, read
# by migrations/env.py. A DSN checked into the repo is a credential checked
# into the repo, and it also guarantees somebody eventually runs a migration
# against the wrong environment.

[alembic]
script_location = migrations
prepend_sys_path = src
# Timestamped, so files sort chronologically and two branches merged in the
# same week do not produce ambiguous ordering.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s
timezone = UTC

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
